name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        run: |
          python -m pip install PyInstaller==6.22.3
          python -m PyInstaller --onefile --name guess-number-game guess_number_game.py

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/guess-number-game.exe README.md LICENSE --clobber
          }
          else {
            gh release create $env:TAG dist/guess-number-game.exe README.md LICENSE --generate-notes
          }
